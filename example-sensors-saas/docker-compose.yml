services:
  questdb:
    image: questdb/questdb:8.2.1
    container_name: saas-questdb
    ports:
      - "9100:9000"   # Web console + REST (SaaS UI)
      - "9109:9009"   # ILP (line protocol) ingestion
      - "18812:8812"  # Postgres wire
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
      QDB_CAIRO_COMMIT_LAG: "1000"
    volumes:
      - questdb_data:/var/lib/questdb

  backend:
    build: ./backend
    container_name: saas-backend
    depends_on:
      - questdb
    environment:
      PORT: "4100"
      QUESTDB_HOST: questdb
      QUESTDB_ILP_PORT: "9009"
      INGEST_TABLE: sensor_reading
    ports:
      - "4100:4100"
    restart: unless-stopped

volumes:
  questdb_data:
